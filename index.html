<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1f2328;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      box-sizing: border-box;
    }
    .card {
      width: min(860px, 100%);
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
      padding: 28px;
    }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { line-height: 1.7; }
    .bookmarklet {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 12px;
      background: #0969da;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(9,105,218,.25);
      user-select: none;
      cursor: grab;
    }
    .bookmarklet:active { cursor: grabbing; }
    .hint {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f6f8fa;
      border: 1px solid #d8dee4;
    }
    textarea {
      width: 100%;
      min-height: 160px;
      box-sizing: border-box;
      margin-top: 12px;
      border-radius: 12px;
      border: 1px solid #d8dee4;
      padding: 12px;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      resize: vertical;
    }
    button.copy {
      margin-top: 10px;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #e6edf3; }
      .card { background: #161b22; border-color: #30363d; }
      .hint { background: #0d1117; border-color: #30363d; }
      textarea, button.copy { background: #0d1117; color: #e6edf3; border-color: #30363d; }
    }
  </style>
</head>
<body>

<main class="card">
    <h1>I_NORI 先导语音识别 Bookmarklet</h1>
    <p>把下面这个蓝色按钮拖到浏览器书签栏。在 NoriOS 页面点击一下就能加载了。按住语音按钮说话，在语音按钮上右键可以调整设置开启语音唤醒。</p>

    <p>
      <a id="bookmarklet" class="bookmarklet" href="#">NoriOS 语音</a>
    </p>


    <div class="hint">
      你也可以通过 Tampermonkey 以 UserScript 方式加载。(与书签二选一使用；书签每次需要手动点击加载但不需要安装浏览器插件，使用 Tampermonkey 会自动加载，但需要浏览器插件)
      <a href="norios-voice.user.js" class="bookmarklet" target="_blank">安装 UserScript</a>
    </div>

    <div class="hint">
      如果不能拖动：右键蓝色按钮，选择“复制链接地址”，然后手动新建书签，把网址粘贴为下面这段 <code>javascript:</code> 内容。
      <textarea id="code" readonly></textarea>
      <button class="copy" id="copyBtn" type="button">复制 bookmarklet 代码</button>
    </div>
  </main>

  <script>
    const bookmarkletCode = `javascript:(()%20%3D%3E%20%7B%0A%20%20const%20BASE%20%3D%20'https%3A%2F%2Fcubesky.github.io%2FNoriOS-Voice%2Fnorios-voice.user.js'%3B%0A%20%20const%20ID%20%3D%20'__norios_voice_bookmarklet_loader__'%3B%0A%0A%20%20document.getElementById(ID)%3F.remove()%3B%0A%0A%20%20const%20script%20%3D%20document.createElement('script')%3B%0A%20%20script.id%20%3D%20ID%3B%0A%20%20script.src%20%3D%20BASE%20%2B%20'%3Fbookmarklet%3D'%20%2B%20Date.now()%3B%0A%20%20script.async%20%3D%20true%3B%0A%0A%20%20script.onload%20%3D%20()%20%3D%3E%20%7B%0A%20%20%20%20console.log('%5BNoriOS%20Voice%5D%20external%20userscript%20loaded')%3B%0A%20%20%20%20script.remove()%3B%0A%20%20%7D%3B%0A%0A%20%20script.onerror%20%3D%20()%20%3D%3E%20%7B%0A%20%20%20%20console.error(%0A%20%20%20%20%20%20'%5BNoriOS%20Voice%5D%20failed%20to%20load%3A'%2C%0A%20%20%20%20%20%20script.src%2C%0A%20%20%20%20%20%20'The%20page%20CSP%20may%20block%20external%20scripts.%20Install%20norios-voice.user.js%20as%20a%20userscript%20if%20needed.'%0A%20%20%20%20)%3B%0A%20%20%20%20script.remove()%3B%0A%20%20%7D%3B%0A%0A%20%20(document.head%20%7C%7C%20document.documentElement).appendChild(script)%3B%0A%7D)()%3B`
    const link = document.getElementById('bookmarklet');
    const code = document.getElementById('code');
    const copyBtn = document.getElementById('copyBtn');

    link.href = bookmarkletCode;
    code.value = bookmarkletCode;

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(bookmarkletCode);
        copyBtn.textContent = '已复制';
      } catch (_) {
        code.select();
        document.execCommand('copy');
        copyBtn.textContent = '已复制';
      }
      setTimeout(() => copyBtn.textContent = '复制 bookmarklet 代码', 1200);
    });
  </script>

</body>
</html>
