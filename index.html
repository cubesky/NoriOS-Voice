<head>

<style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;

      background: #f5f5f7;
      color: #1f2328;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      box-sizing: border-box;
    }
    .card {
      width: min(860px, 100%);
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
      padding: 28px;
    }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { line-height: 1.7; }
    .bookmarklet {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 12px;
      background: #0969da;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(9,105,218,.25);
      user-select: none;
      cursor: grab;
    }
    .bookmarklet:active { cursor: grabbing; }
    .hint {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f6f8fa;
      border: 1px solid #d8dee4;
    }
    textarea {
      width: 100%;
      min-height: 160px;
      box-sizing: border-box;
      margin-top: 12px;
      border-radius: 12px;
      border: 1px solid #d8dee4;
      padding: 12px;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      resize: vertical;
    }
    button.copy {
      margin-top: 10px;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #e6edf3; }
      .card { background: #161b22; border-color: #30363d; }
      .hint { background: #0d1117; border-color: #30363d; }
      textarea, button.copy { background: #0d1117; color: #e6edf3; border-color: #30363d; }
    }
  </style>
</head>
